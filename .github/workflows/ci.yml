name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache OBS dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: obs-windows-${{ hashFiles('buildspec.json') }}

      - name: Verify version metadata
        shell: pwsh
        run: ./scripts/verify-version.ps1

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-ci-x64

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-x64 -- /m:1 /p:CL_MPCount=1

      - name: Add test runtime libraries to PATH
        shell: pwsh
        run: |
          $paths = @((Resolve-Path '.deps/bin/64bit').Path)
          $paths += Get-ChildItem .deps -Directory -Filter 'obs-deps-*-x64' |
            ForEach-Object { Join-Path $_.FullName 'bin' } |
            Where-Object { Test-Path $_ }
          $paths | Sort-Object -Unique | ForEach-Object { $_ >> $env:GITHUB_PATH }

      - name: Test
        shell: pwsh
        run: ctest --preset windows-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDirectory build_x64 -Configuration RelWithDebInfo

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: OBSChzzkPing-${{ github.sha }}-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: OBSChzzkPing-${{ github.sha }}-windows-x64
          path: artifacts

      - name: Verify tag
        shell: pwsh
        run: |
          $version = ./scripts/verify-version.ps1 | Select-Object -Last 1
          if ('v' + $version -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match version $version"
          }

      - name: Check release token
        shell: pwsh
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if (-not $env:RELEASE_REPO_TOKEN) {
            throw 'Add a RELEASE_REPO_TOKEN secret with write access to TereBin/OBSChzzkPing-Release.'
          }

      - name: Update release repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh auth setup-git
          gh repo clone TereBin/OBSChzzkPing-Release release-output
          ./scripts/sync-release-repo.ps1 -ReleaseRepository release-output -ArtifactsDirectory artifacts
          $version = ./scripts/verify-version.ps1 | Select-Object -Last 1
          git -C release-output config user.name 'github-actions[bot]'
          git -C release-output config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C release-output add --all
          git -C release-output commit -m "Publish OBSChzzkPing $version"
          git -C release-output push origin main
          git -C release-output tag "v$version"
          git -C release-output push origin "v$version"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $version = ./scripts/verify-version.ps1 | Select-Object -Last 1
          $changelog = Get-Content CHANGELOG.md -Raw
          $notes = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\s*\r?\n(?<notes>.*?)(?=^## |\z)").Groups['notes'].Value.Trim()
          $notes | Set-Content release-notes.md -Encoding utf8NoBOM
          gh release create "v$version" artifacts/* --repo TereBin/OBSChzzkPing-Release --title "OBSChzzkPing $version" --notes-file release-notes.md --verify-tag
